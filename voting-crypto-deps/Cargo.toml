[package]
name = "voting-crypto-deps"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Selectable upstream and Zakura cryptography dependency facade for shielded voting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/voting-circuits"
readme = "README.md"

[features]
default = ["upstream"]
upstream = [
    "dep:upstream-halo2-gadgets",
    "dep:upstream-halo2-poseidon",
    "dep:upstream-halo2-proofs",
    "dep:upstream-orchard",
    "dep:upstream-pasta-curves",
    "dep:upstream-sinsemilla",
]
zakura = [
    "dep:zakura-halo2-gadgets",
    "dep:zakura-halo2-poseidon",
    "dep:zakura-halo2-proofs",
    "dep:zakura-orchard",
    "dep:zakura-pasta-curves",
    "dep:zakura-sinsemilla",
]

[dependencies]
upstream-halo2-gadgets = { package = "halo2_gadgets", version = "0.5", optional = true, default-features = false }
upstream-halo2-poseidon = { package = "halo2_poseidon", version = "0.1", optional = true }
upstream-halo2-proofs = { package = "halo2_proofs", version = "0.3", optional = true, default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
upstream-orchard = { package = "orchard", version = "0.15", optional = true, features = ["circuit", "unstable-voting-circuits"] }
upstream-pasta-curves = { package = "pasta_curves", version = "0.5", optional = true }
upstream-sinsemilla = { package = "sinsemilla", version = "0.1", optional = true }

zakura-halo2-gadgets = { package = "zakura-halo2-gadgets", version = "1.0.0-rc.1", git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db", optional = true, default-features = false }
zakura-halo2-poseidon = { package = "zakura-halo2-poseidon", version = "1.0.0-rc.1", git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db", optional = true }
zakura-halo2-proofs = { package = "zakura-halo2-proofs", version = "1.0.0-rc.1", git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db", optional = true, default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
zakura-orchard = { package = "zakura-orchard", version = "1.0.0-rc.1", git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db", optional = true, features = ["circuit", "unstable-voting-circuits"] }
zakura-pasta-curves = { package = "zakura-pasta-curves", version = "1.0.0-rc.1", git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db", optional = true }
zakura-sinsemilla = { package = "zakura-sinsemilla", version = "1.0.0-rc.1", git = "https://github.com/zakura-core/libraries", rev = "80a5dd73bc12f6a513c6afd14488911f11f2a9db", optional = true }
