[package]
name = "voting-crypto-deps"
version = "0.3.0"
edition = "2021"
rust-version = "1.97"
description = "Selectable Zakura and LRZ cryptography dependency facade for shielded voting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/voting-circuits"
readme = "README.md"

[features]
default = [
    "vct",
    "poseidon",
    "proofs",
    "orchard",
    "sinsemilla",
    "rand",
]
pasta = ["dep:pasta-curves"]
gadgets = ["dep:halo2-gadgets"]
poseidon = ["dep:halo2-poseidon"]
proofs = ["dep:halo2-proofs"]
orchard = ["pasta", "dep:orchard", "dep:incrementalmerkletree", "dep:zip32", "dep:zcash-note-encryption"]
sinsemilla = ["dep:sinsemilla"]
rand = ["dep:rand"]
vct = [
    "pasta",
    "gadgets",
]
validator = [
    "default",
    "dep:reddsa",
    "dep:zcash-primitives",
]
lrz-pasta = ["dep:lrz-pasta-curves"]
lrz-gadgets = ["dep:lrz-halo2-gadgets"]
lrz-poseidon = ["dep:lrz-halo2-poseidon"]
lrz-proofs = ["dep:lrz-halo2-proofs"]
lrz-orchard = ["lrz-pasta", "dep:lrz-orchard", "dep:lrz-incrementalmerkletree", "dep:lrz-zip32", "dep:lrz-zcash-note-encryption"]
lrz-sinsemilla = ["dep:lrz-sinsemilla"]
lrz-rand = ["dep:rand"]
lrz-vct = [
    "lrz-pasta",
    "lrz-gadgets",
]
lrz = [
    "lrz-vct",
    "lrz-poseidon",
    "lrz-proofs",
    "lrz-orchard",
    "lrz-sinsemilla",
    "lrz-rand",
]
lrz-validator = [
    "lrz",
    "dep:lrz-reddsa",
    "dep:lrz-zcash-primitives",
]

[dependencies]
lrz-halo2-gadgets = { package = "halo2_gadgets", version = "0.6", optional = true, default-features = false }
lrz-halo2-poseidon = { package = "halo2_poseidon", version = "0.2", optional = true }
lrz-halo2-proofs = { package = "halo2_proofs", version = "0.4", optional = true, default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
lrz-orchard = { package = "orchard", version = "0.16", optional = true, features = ["circuit", "unstable-voting-circuits"] }
lrz-pasta-curves = { package = "pasta_curves", version = "0.6", optional = true }
lrz-reddsa = { package = "reddsa", version = "0.6", optional = true, default-features = false, features = ["std"] }
lrz-sinsemilla = { package = "sinsemilla", version = "0.2", optional = true }
lrz-zcash-primitives = { package = "zcash_primitives", version = "0.31.0-pre.0", optional = true, default-features = false, features = ["std"] }

halo2-gadgets = { package = "zakura-halo2-gadgets", git = "https://github.com/zakura-core/common", rev = "2bf16a272f681d9228c34e2ed0b528b03b14c990", optional = true, default-features = false }
halo2-poseidon = { package = "zakura-halo2-poseidon", git = "https://github.com/zakura-core/common", rev = "2bf16a272f681d9228c34e2ed0b528b03b14c990", optional = true }
halo2-proofs = { package = "zakura-halo2-proofs", git = "https://github.com/zakura-core/common", rev = "2bf16a272f681d9228c34e2ed0b528b03b14c990", optional = true, default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
orchard = { package = "zakura-orchard", git = "https://github.com/zakura-core/common", rev = "2bf16a272f681d9228c34e2ed0b528b03b14c990", optional = true, features = ["backend-halo2", "circuit", "circuit-composition", "zip32-addresses"] }
pasta-curves = { package = "zakura-pasta-curves", git = "https://github.com/zakura-core/common", rev = "2bf16a272f681d9228c34e2ed0b528b03b14c990", optional = true }
rand = { package = "rand", version = "0.10", optional = true, default-features = false, features = ["sys_rng"] }
reddsa = { package = "zakura-reddsa", git = "https://github.com/zakura-core/common", rev = "2bf16a272f681d9228c34e2ed0b528b03b14c990", optional = true, default-features = false, features = ["std"] }
sinsemilla = { package = "zakura-sinsemilla", git = "https://github.com/zakura-core/common", rev = "2bf16a272f681d9228c34e2ed0b528b03b14c990", optional = true }
zcash-primitives = { package = "zakura-primitives", git = "https://github.com/zakura-core/common", rev = "2bf16a272f681d9228c34e2ed0b528b03b14c990", optional = true, default-features = false, features = ["std"] }

# Note, address, and witness APIs must use the selected Orchard family.
incrementalmerkletree = { version = "0.8", optional = true }
lrz-incrementalmerkletree = { package = "incrementalmerkletree", version = "0.9", optional = true }
zip32 = { version = "0.2", optional = true }
lrz-zip32 = { package = "zip32", version = "0.3", optional = true }
zcash-note-encryption = { package = "zakura-note-encryption", git = "https://github.com/zakura-core/common", rev = "2bf16a272f681d9228c34e2ed0b528b03b14c990", optional = true }
lrz-zcash-note-encryption = { package = "zcash_note_encryption", version = "0.5", optional = true }
