[package]
name = "voting-crypto-deps"
version = "0.2.2"
edition = "2021"
rust-version = "1.86"
description = "Selectable Zakura and LRZ cryptography dependency facade for shielded voting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/voting-circuits"
readme = "README.md"

[features]
default = [
    "vct",
    "poseidon",
    "proofs",
    "orchard",
    "sinsemilla",
    "rand",
]
pasta = ["dep:pasta-curves"]
gadgets = ["dep:halo2-gadgets"]
poseidon = ["dep:halo2-poseidon"]
proofs = ["dep:halo2-proofs"]
orchard = ["dep:orchard"]
sinsemilla = ["dep:sinsemilla"]
rand = ["dep:rand"]
vct = [
    "pasta",
    "gadgets",
]
validator = [
    "default",
    "dep:reddsa",
    "dep:zcash-primitives",
]
lrz-pasta = ["dep:lrz-pasta-curves"]
lrz-gadgets = ["dep:lrz-halo2-gadgets"]
lrz-poseidon = ["dep:lrz-halo2-poseidon"]
lrz-proofs = ["dep:lrz-halo2-proofs"]
lrz-orchard = ["dep:lrz-orchard"]
lrz-sinsemilla = ["dep:lrz-sinsemilla"]
lrz-rand = ["dep:lrz-rand"]
lrz-vct = [
    "lrz-pasta",
    "lrz-gadgets",
]
lrz = [
    "lrz-vct",
    "lrz-poseidon",
    "lrz-proofs",
    "lrz-orchard",
    "lrz-sinsemilla",
    "lrz-rand",
]
lrz-validator = [
    "lrz",
    "dep:lrz-reddsa",
    "dep:lrz-zcash-primitives",
]

[dependencies]
lrz-halo2-gadgets = { package = "halo2_gadgets", version = "0.5", optional = true, default-features = false }
lrz-halo2-poseidon = { package = "halo2_poseidon", version = "0.1", optional = true }
lrz-halo2-proofs = { package = "halo2_proofs", version = "0.3", optional = true, default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
lrz-orchard = { package = "orchard", version = "0.15", optional = true, features = ["circuit", "unstable-voting-circuits"] }
lrz-pasta-curves = { package = "pasta_curves", version = "0.5", optional = true }
lrz-reddsa = { package = "reddsa", version = "0.5", optional = true, default-features = false, features = ["std"] }
lrz-rand = { package = "rand", version = "0.8", optional = true, default-features = false, features = ["getrandom"] }
lrz-sinsemilla = { package = "sinsemilla", version = "0.1", optional = true }
lrz-zcash-primitives = { package = "zcash_primitives", version = "0.30", optional = true, default-features = false, features = ["std"] }

halo2-gadgets = { package = "zakura-halo2-gadgets", version = "=1.0.0", optional = true, default-features = false }
halo2-poseidon = { package = "zakura-halo2-poseidon", version = "=1.0.0", optional = true }
halo2-proofs = { package = "zakura-halo2-proofs", version = "=1.0.0", optional = true, default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
orchard = { package = "zakura-orchard", version = "=1.0.0", optional = true, features = ["circuit", "unstable-voting-circuits"] }
pasta-curves = { package = "zakura-pasta-curves", version = "=1.0.0", optional = true }
rand = { package = "rand", version = "0.10", optional = true, default-features = false, features = ["sys_rng"] }
reddsa = { package = "zakura-reddsa", version = "=1.0.0", optional = true, default-features = false, features = ["std"] }
sinsemilla = { package = "zakura-sinsemilla", version = "=1.0.0", optional = true }
zcash-primitives = { package = "zakura-primitives", version = "=1.0.0", optional = true, default-features = false, features = ["std"] }
