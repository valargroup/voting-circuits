[package]
name = "voting-circuits"
version = "0.13.0"
edition = "2021"
rust-version = "1.97"
description = "Governance ZKP circuits (delegation, vote proof, share reveal) for the Zcash shielded-voting protocol."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/voting-circuits"
readme = "README.md"

[dependencies]
# Keep this exact so a published release cannot resolve a different circuit dependency graph.
voting-crypto-deps = { path = "voting-crypto-deps", version = "=0.3.0", default-features = false }
blake2b_simd = "1"
lazy_static = "1"
# zip_eq makes length-pairing fail loudly if fixed-size share arrays are ever generalized.
itertools = "0.14.0"
# Reference IMT implementation used by the opt-in integration tests to
# cross-check the in-tree provider. It is optional so selecting the Zakura
# backend does not activate an upstream cryptography family through test-only
# code while imt-tree's own backend migration is developed independently.
imt-tree = { version = "=0.2.0", optional = true }
# Keep the published IMT as an independent encoding oracle for the new family.
legacy-pasta-curves = { package = "pasta_curves", version = "0.5", optional = true }
# The legacy oracle must match the shared maybe-rayon threading configuration.
legacy-halo2-proofs = { package = "halo2_proofs", version = "0.3", features = ["multicore"], optional = true }

[dev-dependencies]
criterion = "0.8"
# Benches only: lets `benches/delegation.rs` drive the prover from a
# deterministic RNG, so prepared and unprepared proving can be compared
# byte for byte.
rand_core = { version = "0.10", default-features = false }
# Force prepared-path tests into a narrow pool, independently of host defaults.
rayon = "1"

[lints.clippy]
# Halo2 circuit helpers naturally take many `AssignedCell` parameters and
# return nested tuples of them.
too_many_arguments = "allow"
type_complexity = "allow"
# Fixed-depth range loops (`for i in 0..DEPTH`) over witness arrays are
# clearer than `.iter().enumerate()` chains in circuit synthesis code.
needless_range_loop = "allow"

[features]
# Use Zakura's cryptography family by default.
default = ["voting-crypto-deps/default"]
# Use the crates.io librustzcash cryptography family.
lrz = ["voting-crypto-deps/lrz"]
# Re-exports `delegation::build_nullifier_list`, used by the in-tree IMT
# integration test. Not part of the stable public API; downstream consumers
# should not enable this.
unstable-internal-api = ["dep:imt-tree", "dep:legacy-pasta-curves", "dep:legacy-halo2-proofs"]

[lib]
bench = false

[[bench]]
name = "delegation"
harness = false

[[test]]
name = "imt_circuit_integration"
required-features = ["unstable-internal-api"]

[workspace]
resolver = "2"
members = ["voting-crypto-deps"]

# Keep every Common package on the same unpublished voting API revision.
[patch.crates-io]
zakura-bellman = { git = "https://github.com/zakura-core/common.git", rev = "f0a08f864d4f88c8ef4a3c2fc6636e8d5ee4df8c" }
