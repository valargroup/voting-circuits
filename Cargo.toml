[package]
name = "voting-circuits"
version = "0.12.2"
edition = "2021"
rust-version = "1.88.0"
description = "Governance ZKP circuits (delegation, vote proof, share reveal) for the Zcash shielded-voting protocol."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/voting-circuits"
readme = "README.md"

[dependencies]
# Keep this exact so a published release cannot resolve a different circuit dependency graph.
voting-crypto-deps = { path = "voting-crypto-deps", version = "=0.2.4", default-features = false }
blake2b_simd = "1"
lazy_static = "1"
# zip_eq makes length-pairing fail loudly if fixed-size share arrays are ever generalized.
itertools = "0.14.0"
# Reference IMT implementation used by the opt-in integration tests to
# cross-check the in-tree provider. Its cryptography backend is selected by
# `unstable-internal-api` to match this crate's active backend.
imt-tree = { path = "imt-tree", version = "0.5.4", optional = true, default-features = false }

[dev-dependencies]
criterion = "0.8"
# Benches only: lets `benches/delegation.rs` drive the prover from a
# deterministic RNG, so prepared and unprepared proving can be compared
# byte for byte.
rand_core = { version = "0.10", default-features = false }
# Force prepared-path tests into a narrow pool, independently of host defaults.
rayon = "1"

[lints.clippy]
# Halo2 circuit helpers naturally take many `AssignedCell` parameters and
# return nested tuples of them.
too_many_arguments = "allow"
type_complexity = "allow"
# Fixed-depth range loops (`for i in 0..DEPTH`) over witness arrays are
# clearer than `.iter().enumerate()` chains in circuit synthesis code.
needless_range_loop = "allow"

[features]
# Use Zakura's cryptography family by default.
default = ["voting-crypto-deps/default", "imt-tree?/zakura"]
# Use the crates.io librustzcash cryptography family.
lrz = ["voting-crypto-deps/lrz", "imt-tree?/upstream"]
# Re-exports `delegation::build_nullifier_list`, used by the in-tree IMT
# integration test. Not part of the stable public API; downstream consumers
# should not enable this.
unstable-internal-api = ["dep:imt-tree"]

[lib]
bench = false

[[bench]]
name = "delegation"
harness = false

[[test]]
name = "imt_circuit_integration"
required-features = ["unstable-internal-api"]

[workspace]
resolver = "2"
members = ["imt-tree", "voting-crypto-deps"]

# Zakura 2.0.0 on crates.io pins pre-release RustCrypto crates (bip32
# 0.6.0-pre.1, crypto-common 0.2.0-rc.1) that cannot share a lockfile with the
# LRZ backend's stable releases. This fork migrates Zakura to the stable stack.
# Remove these entries once zakura-core/common publishes that migration
# (zakura-core/common#538).
[patch.crates-io]
zakura-address = { git = "https://github.com/zodl-inc/zakura-common", rev = "c714f350a629d5419a1c341c192812ce58cb4013" }
zakura-bls12-381 = { git = "https://github.com/zodl-inc/zakura-common", rev = "c714f350a629d5419a1c341c192812ce58cb4013" }
