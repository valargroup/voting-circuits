name: Test

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      run:
        description: Manual test target
        type: choice
        required: true
        default: full-suite
        options:
          - full-suite
          - diagnostics

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  short-tests:
    name: Short tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run short tests
        run: cargo test --locked

      - name: Check minimal default VCT facade
        run: |
          cargo check --locked -p voting-crypto-deps --no-default-features --features vct
          if cargo tree --locked -p voting-crypto-deps --no-default-features \
            --features vct -e normal --prefix none \
            | grep -Eq '^(zakura-orchard|zakura-reddsa|zakura-primitives) v'; then
            echo "Non-VCT package found in the default VCT dependency graph"
            exit 1
          fi

      - name: Check default Zakura dependency graph
        run: |
          if cargo tree --locked -e normal --prefix none \
            | grep -Eq '^(halo2_gadgets|halo2_legacy_pdqsort|halo2_poseidon|halo2_proofs|orchard|pasta_curves|reddsa|sinsemilla|zcash_primitives) v'; then
            echo "LRZ cryptography package found in the default Zakura dependency graph"
            exit 1
          fi

      - name: Test default validator facade
        run: |
          cargo test --locked -p voting-crypto-deps --no-default-features --features validator
          if cargo tree --locked -p voting-crypto-deps --no-default-features \
            --features validator -e normal --prefix none \
            | grep -Eq '^(halo2_gadgets|halo2_legacy_pdqsort|halo2_poseidon|halo2_proofs|orchard|pasta_curves|reddsa|sinsemilla|zcash_primitives) v'; then
            echo "LRZ cryptography package found in the default validator graph"
            exit 1
          fi

      - name: Test LRZ validator facade
        run: |
          cargo test --locked -p voting-crypto-deps --no-default-features --features lrz-validator
          if cargo tree --locked -p voting-crypto-deps --no-default-features \
            --features lrz-validator -e normal --prefix none \
            | grep -Eq '^zakura-'; then
            echo "Zakura package found in the LRZ validator graph"
            exit 1
          fi

      - name: Check verifying-key fingerprints
        run: cargo test --locked vk_fingerprint_unchanged -- --ignored --test-threads=1

      - name: Reject missing or mixed backend selections
        run: |
          if cargo check --locked -p voting-crypto-deps --no-default-features; then
            echo "A cryptography backend must be selected"
            exit 1
          fi
          if cargo check --locked -p voting-crypto-deps --features lrz; then
            echo "The default Zakura and LRZ backends must remain mutually exclusive"
            exit 1
          fi

      - name: Check delegation benchmark
        run: cargo bench --locked --bench delegation -- --test

  lrz-tests:
    name: LRZ backend
    if: github.event_name != 'workflow_dispatch' || inputs.run == 'full-suite'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run short tests
        run: cargo test --locked --no-default-features --features lrz

      - name: Check LRZ dependency graph
        run: |
          if cargo tree --locked --no-default-features --features lrz -e normal --prefix none \
            | grep -Eq '^zakura-'; then
            echo "Zakura package found in the LRZ dependency graph"
            exit 1
          fi

      - name: Check minimal LRZ VCT facade
        run: |
          cargo check --locked -p voting-crypto-deps --no-default-features --features lrz-vct
          if cargo tree --locked -p voting-crypto-deps --no-default-features \
            --features lrz-vct -e normal --prefix none \
            | grep -Eq '^(orchard|reddsa|zcash_primitives) v'; then
            echo "Non-VCT package found in the LRZ VCT dependency graph"
            exit 1
          fi

      - name: Run IMT integration tests
        run: cargo test --locked --no-default-features --features lrz,unstable-internal-api --test imt_circuit_integration

      - name: Check delegation benchmark
        run: cargo bench --locked --no-default-features --features lrz --bench delegation -- --test

  full-suite:
    name: Full suite
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run == 'full-suite')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run short tests
        run: cargo test --locked

      - name: Check default Zakura dependency graph
        run: |
          if cargo tree --locked -e normal --prefix none \
            | grep -Eq '^(halo2_gadgets|halo2_legacy_pdqsort|halo2_poseidon|halo2_proofs|orchard|pasta_curves|reddsa|sinsemilla|zcash_primitives) v'; then
            echo "LRZ cryptography package found in the default Zakura dependency graph"
            exit 1
          fi

      - name: Run long tests
        run: cargo test --locked -- --ignored --skip row_budget --skip cost_breakdown

      - name: Check delegation benchmark
        run: cargo bench --locked --bench delegation -- --test

  diagnostics:
    name: Diagnostics
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run == 'diagnostics')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run row-budget diagnostics
        run: cargo test --locked row_budget -- --ignored --nocapture

      - name: Run cost-breakdown diagnostics
        run: cargo test --locked cost_breakdown -- --ignored --nocapture
